name: CI

on:
  # **Sólo `pull_request`, por decisión del dueño el 2026-09-14.**
  #
  # La historia en dos pasos, porque el primero explica por qué no está `["**"]`:
  #
  # 1. Antes había `push: ["**"]`, y un empuje a una rama con PR abierto disparaba
  #    DOS corridas —una por `push` y otra por `pull_request`— que no se cancelaban
  #    entre sí, porque el grupo de concurrencia usa `github.ref` y vale
  #    `refs/heads/<rama>` en una y `refs/pull/<n>/merge` en la otra. Se acotó a
  #    `main`. Medido entonces: de las últimas 100 corridas, 34 eran `push` a ramas
  #    distintas de `main`.
  # 2. **El 2026-09-14 se agotó el presupuesto de Actions de la cuenta** y nada
  #    volvió a correr: ni los PR ni los pushes a `main`. Medido ese día: **576
  #    corridas desde el 1 de septiembre —283 de `pull_request` y 293 de `push`—**,
  #    o sea que cada fusión pagaba **dos veces**, y **15 se cancelaron solas** por
  #    el grupo de concurrencia: minutos gastados y tirados. El dueño decidió
  #    quitar el `push`.
  #
  # **Lo que se pierde, dicho sin adornos: `main` deja de tener compuerta propia.**
  # Después de fusionar no hay corrida que juzgar. Eso no deja pasar nada sin
  # revisar —la protección de rama exige los tres checks y se evalúan sobre el PR,
  # que sí corre— pero sí quita la red de después: el caso que cubría era el de dos
  # PR verdes por separado que juntos rompen `main`.
  #
  # **Y por eso cambia una instrucción de `CLAUDE.md`:** la de leer el estado del
  # commit fusionado para distinguir `cancelled` de `success` ya no aplica, porque
  # no habrá corrida. El veredicto es el del PR. Está corregido allí, no aquí.
  #
  # Lo que ya se perdía antes y sigue igual: una rama sin PR abierto no tiene CI
  # hasta que se abre. `npm run verify` sigue siendo la primera línea.
  pull_request:

# Sólo lectura: esta compuerta no publica, no comenta y no despliega.
permissions:
  contents: read

# Cancela corridas viejas de la misma rama: sólo importa la última.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ¿Hace falta la compuerta entera? Medido el 2026-09-05 sobre las últimas 30
  # PR fusionadas: 17 tocaban SÓLO documentación, y las 17 corrían Prisma,
  # tipos, lint y once archivos de test sobre archivos `.md`.
  #
  # La definición de "sólo documentación" vive en scripts/solo-documentacion.sh
  # y la comparte el `ignoreCommand` de Vercel. Una sola definición a propósito:
  # dos derivarían, y este repositorio ya sabe cómo acaba eso.
  cambios:
    name: ¿Hay código en este cambio?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      solo_docs: ${{ steps.detectar.outputs.solo_docs }}
    steps:
      # depth 2 basta: en `pull_request` el HEAD es el merge de la PR y su
      # primer padre es la base, así que HEAD^..HEAD es el diff entero de la PR.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: detectar
        # `|| true` porque el script sale 1 cuando hay código, y eso NO es un
        # fallo del paso: es su respuesta. El veredicto se lee de la salida.
        run: bash scripts/solo-documentacion.sh >> "$GITHUB_OUTPUT" || true

  compuerta-documentacion:
    name: Compuerta ligera · sólo documentación
    needs: cambios
    if: needs.cambios.outputs.solo_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Sin `npm ci` a propósito: lo que corre aquí no importa dependencias.
      - name: Compuerta ligera (scripts/ci-documentacion.sh)
        run: bash scripts/ci-documentacion.sh

  compuerta:
    name: Compuerta · tipos, estado, rutas, lint y tests herméticos
    needs: cambios
    if: needs.cambios.outputs.solo_docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Fijada. Local es v24.19.0 y el repositorio del sitio público
          # también fija 24; dejarla al azar del runner haría que la compuerta
          # dijera algo distinto cada mes.
          node-version: 24
          cache: npm
      - run: npm ci
      # Un solo paso a propósito: el contrato vive en scripts/ci.sh, que corre
      # igual en local. Enumerar aquí sus pasos es cómo se separaron las dos
      # compuertas en el otro repositorio.
      - name: Compuerta (scripts/ci.sh)
        run: bash scripts/ci.sh

  # Hasta el 2026-09-05 NINGUNA prueba con base de datos corría en CI: 59
  # archivos que sólo se ejercían en el portátil de quien se acordara de
  # `npm run test:db -- up`. Entre ellos, los cuatro guardias de las revisiones
  # de páginas de ese día — escritos para proteger algo, y protegiéndolo sólo
  # en local.
  #
  # Medido antes de construir esto: de los 58 con base, 46 pasan con una base
  # sembrada desde vacío (dos corridas desde cero, 46/46 y 460/460 las dos).
  # Los otros 12 leen datos que no crean y siguen necesitando el backup
  # restaurado; están en el grupo `datos-reales`.
  #
  # Job aparte y no un paso más de `compuerta`: así un fallo dice si cayó la
  # parte hermética o la que toca base, y la hermética sigue dando veredicto en
  # dos minutos sin esperar a que arranque Postgres.
  compuerta-con-base:
    name: Compuerta · pruebas que necesitan base de datos
    needs: cambios
    if: needs.cambios.outputs.solo_docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # PostGIS, no `postgres:18` a secas. La migración
        # `20260810010606_enable_postgis_location_geopoint` hace
        # `CREATE EXTENSION postgis`, y la imagen oficial de Postgres no la
        # trae: el primer intento murió ahí con «extension "postgis" is not
        # available». En local no se ve, porque Postgres.app la incluye — el
        # clásico «funciona en mi máquina», y sólo lo dijo el runner.
        #
        # Comprobado que `postgis` es la ÚNICA extensión que piden las 60
        # migraciones, para no arreglar ésta y tropezar con la siguiente.
        # Mayor fijada a 18, la misma del cluster local de `scripts/test-db.sh`.
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nectar_ci
        ports:
          - 5432:5432
        # Sin esto el job arranca antes que la base y falla al conectar, que se
        # lee como una prueba rota en vez de como una carrera perdida.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Un solo paso, igual que arriba: el contrato vive en el script, que corre
      # igual en local contra cualquier base vacía.
      - name: Compuerta con base (scripts/ci-con-base.sh)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nectar_ci
        run: bash scripts/ci-con-base.sh
