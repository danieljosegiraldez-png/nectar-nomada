name: CI

on:
  # `push` sólo en `main`. Con `["**"]`, un empuje a una rama con PR abierto
  # disparaba DOS corridas —una por `push` y otra por `pull_request`— y no se
  # cancelaban entre sí porque el grupo de concurrencia usa `github.ref`, que
  # vale `refs/heads/<rama>` en una y `refs/pull/<n>/merge` en la otra.
  #
  # Medido sobre las últimas 100 corridas de este repositorio: 34 eran `push` a
  # ramas distintas de `main`, y 33 de los 67 commits dispararon los dos
  # eventos. El mismo cambio se hizo en `nectarnomada-web`, donde pesaba 42 %.
  #
  # Lo que se pierde: una rama sin PR abierto no tiene CI hasta que se abre.
  # La compuerta local (`npm run verify`) sigue siendo la primera línea, y el
  # PR vuelve a cubrirla antes de que nada pueda fusionarse.
  push:
    branches: [main]
  pull_request:

# Sólo lectura: esta compuerta no publica, no comenta y no despliega.
permissions:
  contents: read

# Cancela corridas viejas de la misma rama: sólo importa la última.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compuerta:
    name: Compuerta · tipos, estado, rutas, lint y tests herméticos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Fijada. Local es v24.19.0 y el repositorio del sitio público
          # también fija 24; dejarla al azar del runner haría que la compuerta
          # dijera algo distinto cada mes.
          node-version: 24
          cache: npm
      - run: npm ci
      # Un solo paso a propósito: el contrato vive en scripts/ci.sh, que corre
      # igual en local. Enumerar aquí sus pasos es cómo se separaron las dos
      # compuertas en el otro repositorio.
      - name: Compuerta (scripts/ci.sh)
        run: bash scripts/ci.sh
